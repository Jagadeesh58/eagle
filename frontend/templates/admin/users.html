{% extends "base.html" %}
{% block title %}Manage Users{% endblock %}
{% block page_title %}Users{% endblock %}
{% block content %}
<div class="toolbar">
    <div class="toolbar-left">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search users...">
        </div>
    </div>
    <button class="btn btn-primary" onclick="openUserModal()">+ Add User</button>
</div>

<div class="table-container">
    <table class="data-table" id="usersTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Manager ID</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="7" class="text-center"><div class="spinner"></div></td></tr>
        </tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal-overlay" id="userModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">Add User</h3>
            <button class="modal-close" onclick="closeModal('userModal')">×</button>
        </div>
        <form id="userForm" onsubmit="return saveUser(event)">
            <div class="modal-body">
                <input type="hidden" id="userId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Name <span class="required">*</span></label>
                        <input type="text" id="userName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="userEmail" class="form-control" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Password <span class="required">*</span></label>
                        <input type="password" id="userPassword" class="form-control">
                        <div class="form-help" id="pwdHelp" style="display:none">Leave blank to keep unchanged</div>
                    </div>
                    <div class="form-group">
                        <label>Role <span class="required">*</span></label>
                        <select id="userRole" class="form-control" required>
                            <option value="admin">Admin</option>
                            <option value="manager">Manager</option>
                            <option value="field_coordinator">Field Coordinator</option>
                            <option value="delivery_coordinator">Delivery Coordinator</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Manager ID</label>
                    <input type="number" id="userManagerId" class="form-control" placeholder="Optional">
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="userMobile" class="form-control" placeholder="+91 98765 43210">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('userModal')">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveBtn">Confirm</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let usersData = [];

document.addEventListener('DOMContentLoaded', () => {
    loadUsers();
    setupTableSearch('searchInput', 'usersTable');
});

async function loadUsers() {
    try {
        usersData = await api('GET', '/users');
        renderTable();
    } catch (e) {
        showNotification(e.message, 'error');
    }
}

function renderTable() {
    const tbody = document.querySelector('#usersTable tbody');
    if (!usersData.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">No users found.</td></tr>';
        return;
    }
    
    tbody.innerHTML = usersData.map(u => `
        <tr>
            <td class="cell-id">#${u.id}</td>
            <td>${escapeHtml(u.name)}</td>
            <td>${escapeHtml(u.email)}</td>
            <td>${roleBadge(u.role)}</td>
            <td>${u.manager_id ? '#'+u.manager_id : '—'}</td>
            <td class="cell-muted">${formatDate(u.created_at)}</td>
            <td>
                <div class="actions">
                    <button class="btn-icon" onclick='editUser(${JSON.stringify(u).replace(/'/g, "&#39;")})'>✏️</button>
                    <button class="btn-icon danger" onclick="deleteUser(${u.id})">🗑️</button>
                </div>
            </td>
        </tr>
    `).join('');
}

function openUserModal() {
    document.getElementById('modalTitle').textContent = 'Add User';
    document.getElementById('userForm').reset();
    document.getElementById('userId').value = '';
    document.getElementById('userEmail').disabled = false;
    document.getElementById('userPassword').required = true;
    document.getElementById('pwdHelp').style.display = 'none';
    openModal('userModal');
}

function editUser(u) {
    document.getElementById('modalTitle').textContent = 'Edit User';
    document.getElementById('userId').value = u.id;
    document.getElementById('userName').value = u.name;
    document.getElementById('userEmail').value = u.email;
    document.getElementById('userEmail').disabled = true;
    document.getElementById('userRole').value = u.role;
    document.getElementById('userManagerId').value = u.manager_id || '';
    document.getElementById('userMobile').value = u.mobile || '';
    
    document.getElementById('userPassword').value = '';
    document.getElementById('userPassword').required = false;
    document.getElementById('pwdHelp').style.display = 'block';
    
    openModal('userModal');
}

async function saveUser(e) {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Confirming...';
    
    try {
        const id = document.getElementById('userId').value;
        const payload = {
            name: document.getElementById('userName').value,
            email: document.getElementById('userEmail').value,
            role: document.getElementById('userRole').value,
        };
        
        const pwd = document.getElementById('userPassword').value;
        if (pwd) payload.password = pwd;
        
        const mId = document.getElementById('userManagerId').value;
        if (mId) payload.manager_id = parseInt(mId);

        const mob = document.getElementById('userMobile').value.trim();
        if (mob) payload.mobile = mob;
        
        if (id) {
            payload.id = parseInt(id);
            await api('PUT', '/users', payload);
            showNotification('User updated');
        } else {
            await api('POST', '/users', payload);
            showNotification('User created');
        }
        
        closeModal('userModal');
        loadUsers();
    } catch (err) {
        showNotification(err.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Confirm';
    }
}

async function deleteUser(id) {
    if (await confirmAction('Are you sure you want to delete this user?')) {
        try {
            await api('DELETE', `/users/${id}`);
            showNotification('User deleted');
            loadUsers();
        } catch (e) {
            showNotification(e.message, 'error');
        }
    }
}
</script>
{% endblock %}
