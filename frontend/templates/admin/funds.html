{% extends "base.html" %}
{% block title %}Manage Funds{% endblock %}
{% block page_title %}Funds{% endblock %}
{% block content %}
<div class="toolbar">
    <div class="toolbar-left"></div>
    <button class="btn btn-primary" onclick="openFundModal()">+ Assign Fund</button>
</div>

<div class="table-container">
    <table class="data-table" id="fundsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Manager</th>
                <th>Total Budget</th>
                <th>Spent</th>
                <th>Remaining</th>
                <th>Created At</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="7" class="text-center"><div class="spinner"></div></td></tr>
        </tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal-overlay" id="fundModal">
    <div class="modal">
        <div class="modal-header">
            <h3>Assign Fund</h3>
            <button class="modal-close" onclick="closeModal('fundModal')">×</button>
        </div>
        <form id="fundForm" onsubmit="return saveFund(event)">
            <div class="modal-body">
                <div class="form-group">
                    <label>Manager <span class="required">*</span></label>
                    <select id="fundManager" class="form-control" required>
                        <option value="">Select Manager</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Total Amount (₹) <span class="required">*</span></label>
                    <input type="number" step="1000" id="fundAmount" class="form-control" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('fundModal')">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveBtn">Save Fund</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let fundsData = [];
let managersData = [];

document.addEventListener('DOMContentLoaded', async () => {
    await loadManagers();
    loadFunds();
});

async function loadManagers() {
    try {
        const users = await api('GET', '/users');
        managersData = users.filter(u => u.role === 'manager');
        const sel = document.getElementById('fundManager');
        managersData.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.textContent = `${m.name} (#${m.id})`;
            sel.appendChild(opt);
        });
    } catch (e) {
        showNotification('Failed to load managers', 'error');
    }
}

async function loadFunds() {
    try {
        fundsData = await api('GET', '/funds');
        renderTable();
    } catch (e) {
        showNotification(e.message, 'error');
    }
}

function renderTable() {
    const tbody = document.querySelector('#fundsTable tbody');
    if (!fundsData.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">No funds found.</td></tr>';
        return;
    }
    
    tbody.innerHTML = fundsData.map(f => {
        const mgr = managersData.find(m => m.id === f.manager_id);
        const mgrName = mgr ? mgr.name : `ID: ${f.manager_id}`;
        
        const total = parseFloat(f.total_amount || 0);
        const spent = parseFloat(f.spent_amount || 0);
        const rem = total - spent;
        
        return `
        <tr>
            <td class="cell-id">#${f.id}</td>
            <td>${mgrName}</td>
            <td class="fw-600">${formatCurrency(total)}</td>
            <td class="text-danger">${formatCurrency(spent)}</td>
            <td class="text-success fw-600">${formatCurrency(rem)}</td>
            <td class="cell-muted">${formatDate(f.created_at)}</td>
            <td>
                <div class="actions">
                    <button class="btn-icon danger" onclick="deleteFund(${f.id})">🗑️</button>
                </div>
            </td>
        </tr>
    `}).join('');
}

function openFundModal() {
    document.getElementById('fundForm').reset();
    openModal('fundModal');
}

async function saveFund(e) {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    
    try {
        const payload = {
            manager_id: parseInt(document.getElementById('fundManager').value),
            total_amount: parseFloat(document.getElementById('fundAmount').value)
        };
        await api('POST', '/funds', payload);
        showNotification('Fund assigned');
        closeModal('fundModal');
        loadFunds();
    } catch (err) {
        showNotification(err.message, 'error');
    } finally {
        btn.disabled = false;
    }
}

async function deleteFund(id) {
    if (await confirmAction('Are you sure you want to delete this fund record?')) {
        try {
            await api('DELETE', `/funds/${id}`);
            showNotification('Fund deleted');
            loadFunds();
        } catch (e) {
            showNotification(e.message, 'error');
        }
    }
}
</script>
{% endblock %}
