{% extends "base.html" %}
{% block title %}Verify Attendance{% endblock %}
{% block page_title %}Attendance{% endblock %}
{% block content %}
<div class="toolbar">
    <div class="toolbar-left">
        <div class="filter-group">
            <select id="coordFilter" class="form-control" onchange="loadAttendance()">
                <option value="">Select Coordinator...</option>
            </select>
        </div>
    </div>
</div>

<div class="table-container">
    <table class="data-table" id="attTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Sub Area ID</th>
                <th>Check-in Time</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="5" class="text-center py-4">Select a coordinator to view attendance records.</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
let session;
let attData = [];

document.addEventListener('DOMContentLoaded', async () => {
    session = getSession();
    if (!session) return;
    
    try {
        const coords = await api('GET', `/users/manager/${session.id}/coordinators`);
        const sel = document.getElementById('coordFilter');
        coords.filter(c => c.role === 'field_coordinator').forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.name} (#${c.id})`;
            sel.appendChild(opt);
        });
    } catch(e) {}
});

async function loadAttendance() {
    const cid = document.getElementById('coordFilter').value;
    const tbody = document.querySelector('#attTable tbody');
    
    if (!cid) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center">Select a coordinator to view attendance records.</td></tr>';
        return;
    }
    
    tbody.innerHTML = '<tr><td colspan="5" class="text-center"><div class="spinner"></div></td></tr>';
    
    try {
        attData = await api('GET', `/attendance/coordinator/${cid}`).catch(() => []);
        renderTable();
    } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">${e.message}</td></tr>`;
    }
}

function renderTable() {
    const tbody = document.querySelector('#attTable tbody');
    if (!attData.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center">No records found.</td></tr>';
        return;
    }
    
    tbody.innerHTML = attData.map(a => `
        <tr>
            <td class="cell-id">#${a.id}</td>
            <td>SubArea #${a.sub_area_id}</td>
            <td>${formatDateTime(a.check_in_time)}</td>
            <td>${boolBadge(a.is_present, 'Verified', 'Pending')}</td>
            <td>
                ${a.is_present 
                    ? `<span class="text-success fw-600">✓ Done</span>` 
                    : `<button class="btn btn-primary btn-sm" onclick="verify(${a.id})">Verify</button>`
                }
            </td>
        </tr>
    `).join('');
}

async function verify(id) {
    try {
        await api('PUT', `/attendance/verify/${id}`);
        showNotification('Attendance verified successfully');
        loadAttendance();
    } catch(e) {
        showNotification(e.message, 'error');
    }
}
</script>
{% endblock %}
