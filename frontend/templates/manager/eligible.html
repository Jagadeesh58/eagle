{% extends "base.html" %}
{% block title %}Eligible Families{% endblock %}
{% block page_title %}Eligible Families{% endblock %}
{% block content %}
<div class="toolbar">
    <div class="toolbar-left"></div>
</div>

<div class="table-container">
    <table class="data-table" id="eligibleTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Ben ID</th>
                <th>Per Capita Income</th>
                <th>Threshold</th>
                <th>Delivery Status</th>
                <th>Approved Date</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="6" class="text-center"><div class="spinner"></div></td></tr>
        </tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
let session;
let eligibleData = [];

document.addEventListener('DOMContentLoaded', () => {
    session = getSession();
    if (!session) return;
    loadEligible();
});

async function loadEligible() {
    try {
        const all = await api('GET', '/eligible').catch(() => []);
        // Only show those approved by this manager
        eligibleData = all.filter(e => e.approved_by === session.id);
        renderTable();
    } catch (e) {
        showNotification(e.message, 'error');
    }
}

function renderTable() {
    const tbody = document.querySelector('#eligibleTable tbody');
    if (!eligibleData.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">No eligible families found.</td></tr>';
        return;
    }
    
    tbody.innerHTML = eligibleData.map(e => `
        <tr>
            <td class="cell-id">#${e.id}</td>
            <td><strong>#${e.beneficiary_id}</strong></td>
            <td class="fw-600 text-warning">${formatCurrency(e.per_capita_income)}</td>
            <td class="cell-muted">${formatCurrency(e.approval_threshold)}</td>
            <td>${statusBadge(e.delivery_status)}</td>
            <td>${formatDate(e.approved_at)}</td>
        </tr>
    `).join('');
}
</script>
{% endblock %}
