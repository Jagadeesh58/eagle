{% extends "base.html" %}
{% block title %}My Funds{% endblock %}
{% block page_title %}Budget & Funds{% endblock %}
{% block content %}
<div class="stats-grid" id="fundStats">
    <div class="stat-card primary">
        <div class="stat-icon">💰</div>
        <div class="stat-number" id="fTotal">-</div>
        <div class="stat-label">Total Allocated</div>
    </div>
    <div class="stat-card danger">
        <div class="stat-icon">📉</div>
        <div class="stat-number" id="fSpent">-</div>
        <div class="stat-label">Spent Amount</div>
    </div>
    <div class="stat-card success">
        <div class="stat-icon">🏦</div>
        <div class="stat-number" id="fRem">-</div>
        <div class="stat-label">Remaining Balance</div>
    </div>
</div>

<div class="card mt-24">
    <div class="card-header">
        <h3>Record Spending</h3>
    </div>
    <div class="card-body">
        <form onsubmit="return spendFund(event)" style="max-width: 400px;">
            <div class="form-group">
                <label>Amount Spent (₹) <span class="required">*</span></label>
                <input type="number" step="0.01" id="spendAmount" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-warning" id="spendBtn">Deduct from Budget</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let session;

document.addEventListener('DOMContentLoaded', () => {
    session = getSession();
    if (!session) return;
    loadFund();
});

async function loadFund() {
    try {
        const f = await api('GET', `/funds/manager/${session.id}`);
        const total = parseFloat(f.total_amount || 0);
        const spent = parseFloat(f.spent_amount || 0);
        const rem = total - spent;
        
        document.getElementById('fTotal').textContent = formatCurrency(total);
        document.getElementById('fSpent').textContent = formatCurrency(spent);
        document.getElementById('fRem').textContent = formatCurrency(rem);
    } catch (e) {
        showNotification('No funds assigned to you yet.', 'warning');
        document.getElementById('fTotal').textContent = '₹0.00';
        document.getElementById('fSpent').textContent = '₹0.00';
        document.getElementById('fRem').textContent = '₹0.00';
    }
}

async function spendFund(e) {
    e.preventDefault();
    const btn = document.getElementById('spendBtn');
    btn.disabled = true;
    
    try {
        const amt = parseFloat(document.getElementById('spendAmount').value);
        await api('PUT', '/funds/spend', {
            manager_id: session.id,
            amount_spent: amt
        });
        showNotification(`Successfully deducted ${formatCurrency(amt)}`);
        document.getElementById('spendAmount').value = '';
        loadFund();
    } catch(err) {
        showNotification(err.message, 'error');
    } finally {
        btn.disabled = false;
    }
}
</script>
{% endblock %}
