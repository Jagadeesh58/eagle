{% extends "base.html" %}
{% block title %}Beneficiaries{% endblock %}
{% block page_title %}Beneficiaries{% endblock %}
{% block content %}
<div class="card mb-24">
    <div class="card-body">
        <form class="form-row" onsubmit="return filterBeneficiaries(event)">
            <div class="form-group mb-0">
                <label>Select Sub Area</label>
                <select id="filterSubArea" class="form-control" required></select>
            </div>
            <div class="form-group mb-0">
                
            </div>
        </form>
    </div>
</div>

<div class="table-container">
    <table class="data-table" id="bensTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Family Head Name</th>
                <th>Members</th>
                <th>Annual Income</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="6" class="text-center py-4">Use the filter above to find eligible families.</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
let session;
let bensData = [];

document.addEventListener('DOMContentLoaded', async () => {
    session = getSession();
    if (!session) return;
    
    try {
        const subs = await api('GET', `/subareas/manager/${session.id}`).catch(() => []);
        const sel = document.getElementById('filterSubArea');
        subs.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = `${escapeHtml(s.sub_area_name)} (#${s.id})`;
            sel.appendChild(opt);
        });
    } catch(e) {}
});

async function filterBeneficiaries(e) {
    e.preventDefault();
    const btn = document.getElementById('filterBtn');
    btn.disabled = true;
    btn.textContent = 'Filtering...';
    
    const tbody = document.querySelector('#bensTable tbody');
    tbody.innerHTML = '<tr><td colspan="6" class="text-center"><div class="spinner"></div></td></tr>';
    try {
        const sub_area_id = parseInt(document.getElementById('filterSubArea').value);
        const limit = parseFloat(document.getElementById('filterLimit').value);
        
        bensData = await api('POST', '/beneficiaries/filter', { sub_area_id, per_capita_limit: limit });
        renderTable();
    } catch (err) {
        showNotification(err.message, 'error');
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">${err.message}</td></tr>`;
    } finally {
        btn.disabled = false;
        btn.textContent = 'Filter';
    }
}

function renderTable() {
    const tbody = document.querySelector('#bensTable tbody');
    if (!bensData || !bensData.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">No families match this criteria.</td></tr>';
        return;
    }
    
    tbody.innerHTML = bensData.map(b => {
        const pc = b.family_members > 0 ? b.annual_income / b.family_members : 0;
        return `
        <tr>
            <td class="cell-id">#${b.id}</td>
            <td><strong>${escapeHtml(b.family_name)}</strong></td>
            <td>${b.family_members}</td>
            <td>${formatCurrency(b.annual_income)}</td>
            <td>${boolBadge(b.is_approved, 'Approved', 'Pending')}</td>
            <td>
                ${b.is_approved 
                    ? `<span class="text-success fw-600">✓ Approved</span>` 
                    : `<button class="btn btn-success btn-sm" onclick="approve(${b.id})">Approve</button>`
                }
            </td>
        </tr>
    `}).join('');
}

async function approve(id) {
    try {
        await api('PUT', `/beneficiaries/approve/${id}`);
        showNotification('Family approved successfully');
        
        // Also auto-add to eligible families table
        const ben = bensData.find(b => b.id === id);
        const pc = ben.family_members > 0 ? ben.annual_income / ben.family_members : 0;
        const limit = parseFloat(document.getElementById('filterLimit').value);
        
        await api('POST', '/eligible', {
            beneficiary_id: id,
            per_capita_income: pc,
            approval_threshold: limit,
            approved_by: session.id
        });
        
        document.getElementById('filterBtn').click(); // refresh list
    } catch(e) {
        showNotification(e.message, 'error');
    }
}
</script>
{% endblock %}
