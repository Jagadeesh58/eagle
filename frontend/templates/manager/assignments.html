{% extends "base.html" %}
{% block title %}Assignments{% endblock %}
{% block page_title %}Delivery Assignments{% endblock %}
{% block content %}

<div class="toolbar">
    <div class="toolbar-left">
        <div class="search-box"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="Search family, coordinator..."></div>
    </div>
    <button class="btn btn-primary" onclick="openAssignModal()">+ New Assignment</button>
</div>

<div class="table-container">
    <table class="data-table" id="assignTable">
        <thead>
            <tr><th>ID</th><th>Family Name</th><th>Sub Area</th><th>Delivery Coordinator</th><th>Assigned Date</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody><tr><td colspan="7" class="text-center"><div class="spinner"></div></td></tr></tbody>
    </table>
</div>

<!-- Assignment Modal -->
<div class="modal-overlay" id="assignModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="assignModalTitle">New Assignment</h3>
            <button class="modal-close" onclick="closeModal('assignModal')">✕</button>
        </div>
        <form id="assignForm" onsubmit="return saveAssign(event)">
            <div class="modal-body">
                <input type="hidden" id="assignId">
                <div class="form-group">
                    <label>Approved Beneficiary / Family <span class="required">*</span></label>
                    <select id="asBen" class="form-control" required>
                        <option value="">— Select approved family —</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Delivery Coordinator <span class="required">*</span></label>
                        <select id="asCoord" class="form-control" required>
                            <option value="">— Select coordinator —</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Assigned Date <span class="required">*</span></label>
                        <input type="date" id="asDate" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Sub Area</label>
                    <select id="asSub" class="form-control">
                        <option value="">— Auto from beneficiary —</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('assignModal')">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveAssignBtn">Confirm</button>
            </div>
        </form>
    </div>
</div>

<!-- Status Update Modal -->
<div class="modal-overlay" id="statusModal">
    <div class="modal" style="max-width:360px">
        <div class="modal-header"><h3>Update Status</h3><button class="modal-close" onclick="closeModal('statusModal')">✕</button></div>
        <div class="modal-body">
            <input type="hidden" id="statusAssignId">
            <div class="form-group">
                <label>New Status</label>
                <select id="statusSelect" class="form-control">
                    <option value="pending">⏳ Pending</option>
                    <option value="delivered">📦 Delivered</option>
                    <option value="completed">✅ Completed</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal('statusModal')">Cancel</button>
            <button class="btn btn-primary" onclick="saveStatus()">Confirm</button>
        </div>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script>
let session, assignData=[], coordsData=[], bensData=[], subsData=[];

document.addEventListener('DOMContentLoaded', async () => {
    session = getSession();
    if (!session) return;
    setupTableSearch('searchInput','assignTable');
    await loadDropdowns();
    loadAssignments();
});

async function loadDropdowns() {
    const [coords, bens, subs] = await Promise.all([
        api('GET',`/users/manager/${session.id}/coordinators`).catch(()=>[]),
        api('GET',`/beneficiaries/manager/${session.id}`).catch(()=>[]),
        api('GET',`/subareas/manager/${session.id}`).catch(()=>[])
    ]);
    coordsData = coords.filter(c => c.role==='delivery_coordinator');
    bensData   = bens.filter(b => b.is_approved);
    subsData   = subs;

    const cSel = document.getElementById('asCoord');
    cSel.innerHTML = '<option value="">— Select coordinator —</option>';
    coordsData.forEach(c => {
        const o=document.createElement('option'); o.value=c.id; o.textContent=c.name; cSel.appendChild(o);
    });

    const bSel = document.getElementById('asBen');
    bSel.innerHTML = '<option value="">— Select approved family —</option>';
    bensData.forEach(b => {
        const o=document.createElement('option');
        o.value=b.id; o.textContent=`${b.family_name} (${b.family_members} members)`;
        o.dataset.subAreaId = b.sub_area_id;
        bSel.appendChild(o);
    });
    bSel.addEventListener('change', () => {
        const opt = bSel.options[bSel.selectedIndex];
        if (opt && opt.dataset.subAreaId) {
            document.getElementById('asSub').value = opt.dataset.subAreaId;
        }
    });

    const sSel = document.getElementById('asSub');
    sSel.innerHTML = '<option value="">— Auto from beneficiary —</option>';
    subsData.forEach(s => {
        const o=document.createElement('option'); o.value=s.id; o.textContent=s.sub_area_name; sSel.appendChild(o);
    });
}

async function loadAssignments() {
    try {
        assignData = await api('GET',`/assignments/manager/${session.id}`).catch(()=>[]);
        renderTable();
    } catch(e) { showNotification(e.message,'error'); }
}

function renderTable() {
    const tbody = document.querySelector('#assignTable tbody');
    if (!assignData.length) {
        tbody.innerHTML='<tr><td colspan="7" class="text-center" style="padding:40px;color:var(--text-3)"><div style="font-size:2rem;margin-bottom:8px">📝</div>No assignments yet. Create one to assign a delivery coordinator.</td></tr>';
        return;
    }
    tbody.innerHTML = assignData.map(a=>`
        <tr>
            <td class="cell-id">#${a.id}</td>
            <td><strong>${escapeHtml(a.family_name||'Family #'+a.beneficiary_id)}</strong>
                <div style="font-size:.75rem;color:var(--text-3)">${a.family_members?a.family_members+' members':''}</div>
            </td>
            <td class="cell-muted">${escapeHtml(a.sub_area_name||'Sub Area #'+a.sub_area_id)}</td>
            <td>${escapeHtml(a.coordinator_name||a.coordinator2_id)}</td>
            <td class="cell-muted">${formatDate(a.assigned_date)}</td>
            <td>${statusBadge(a.status)}</td>
            <td>
                <div class="actions">
                    <button class="btn-icon" title="Change status" onclick="openStatusModal(${a.id},'${a.status}')">🔄</button>
                    <button class="btn-icon danger" title="Delete" onclick="deleteAssign(${a.id})">🗑️</button>
                </div>
            </td>
        </tr>`).join('');
}

function openAssignModal() {
    document.getElementById('assignModalTitle').textContent = 'New Assignment';
    document.getElementById('assignForm').reset();
    document.getElementById('assignId').value = '';
    document.getElementById('asDate').valueAsDate = new Date();
    openModal('assignModal');
}

function openStatusModal(id, currentStatus) {
    document.getElementById('statusAssignId').value = id;
    document.getElementById('statusSelect').value = currentStatus || 'pending';
    openModal('statusModal');
}

async function saveStatus() {
    const id = document.getElementById('statusAssignId').value;
    const status = document.getElementById('statusSelect').value;
    try {
        await api('PUT', `/assignments/${id}/status`, { status });
        showNotification('Status updated to ' + status);
        closeModal('statusModal');
        loadAssignments();
    } catch(e) { showNotification(e.message,'error'); }
}

async function saveAssign(e) {
    e.preventDefault();
    const btn = document.getElementById('saveAssignBtn');
    btn.disabled=true; btn.textContent='Confirming...';
    try {
        const id = document.getElementById('assignId').value;
        const subId = document.getElementById('asSub').value;
        const payload = {
            manager_id:      session.id,
            coordinator2_id: parseInt(document.getElementById('asCoord').value),
            beneficiary_id:  parseInt(document.getElementById('asBen').value),
            assigned_date:   document.getElementById('asDate').value
        };
        if (subId) payload.sub_area_id = parseInt(subId);
        if (id) { payload.id=parseInt(id); await api('PUT','/assignments',payload); showNotification('Assignment updated'); }
        else    { await api('POST','/assignments',payload); showNotification('Assignment created'); }
        closeModal('assignModal');
        loadAssignments();
    } catch(err) { showNotification(err.message,'error'); }
    finally { btn.disabled=false; btn.textContent='Confirm'; }
}

async function deleteAssign(id) {
    if (await confirmAction('Delete this delivery assignment?','Delete Assignment','Delete'))
    try { await api('DELETE',`/assignments/${id}`); showNotification('Assignment deleted'); loadAssignments(); }
    catch(e) { showNotification(e.message,'error'); }
}
</script>
{% endblock %}
